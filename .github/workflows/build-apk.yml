name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          cd "android-app"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then chmod +x gradlew; GR=./gradlew; else GR=gradle; fi
          $GR assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p apks
          find . -path "*/build/outputs/apk/*" -name "*.apk" -not -path "./apks/*" -exec cp --backup=numbered {} apks/ \;
          ls -la apks
          APK=$(ls -S apks/*.apk | head -1)
          echo "APK=$APK"
          test -n "$APK"
          cp "$APK" app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app.apk
